<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboards | AxonEDU</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="nav-root"></div>
<main style="max-width:900px;margin:0 auto;padding:30px 20px 60px">
  <h1 style="font-size:34px">Leaderboards</h1>
  <p class="mut" style="font-size:17px">Ranked by total XP. Wrong answers cost XP, but your score never drops below zero.</p>

  <div class="pills" style="justify:center;margin-bottom:14px">
    <div class="pill on" id="lb-xp" onclick="setKind('xp')">By XP</div>
    <div class="pill" id="lb-wins" onclick="setKind('wins')">By wins</div>
  </div>

  <div id="lb-me" class="card" style="margin-bottom:16px"></div>

  <section class="sec">
    <h2>Top players</h2>
    <table id="lb-table"><thead><tr><th>Rank</th><th>Player</th><th>Level</th><th>XP</th><th>Wins</th><th>Class</th></tr></thead><tbody></tbody></table>
    <div class="mut" id="lb-note" style="margin-top:8px"></div>
    <button class="btn" onclick="loadLb()" style="margin-top:12px">Refresh</button>
  </section>

  <section class="sec">
    <h2>Recent results</h2>
    <div id="lb-recent" class="card"></div>
  </section>
</main>
<div id="footer-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
var lbKind='xp';
function setKind(k){lbKind=k;document.getElementById('lb-xp').classList.toggle('on',k==='xp');document.getElementById('lb-wins').classList.toggle('on',k==='wins');loadLb();}
function loadLb(){
  loadBoard(lbKind,function(rows){
    var me=U.id||U.name;
    var tbody=document.querySelector('#lb-table tbody');tbody.innerHTML='';
    rows.forEach(function(r,i){
      var cls=r.cls||'—';
      tbody.innerHTML+='<tr'+(r.id===me||r.name===U.name?' class="me"':'')+'><td><b>'+(i+1)+'</b></td><td>'+av(26,r)+' '+clean(r.name)+'</td><td>'+lvlXp(r.xp)+'</td><td>'+r.xp+'</td><td>'+r.wins+'</td><td>'+clean(cls)+'</td></tr>';
    });
    var myrank=rankMe(lbKind);
    document.getElementById('lb-me').innerHTML='<b>You:</b> '+clean(U.name||'You')+' · Level '+lvl()+' · XP '+U.xp+' · Wins '+U.wins+' &nbsp;·&nbsp; Rank <b>'+(myrank||'—')+'</b>';
    var note=document.getElementById('lb-note');
    note.textContent=LB.loading?'Loading…':(LB.note||(rows.length?'Showing top '+rows.length+' players.':'No players yet.'));
  });
}
function lvlXp(xp){return Math.floor(xp/100)+1;}
function recentResults(){
  var st=U.st||{},keys=[];
  for(var k in st){
    var m=k.match(/^(.+)_(played|best|w)$/);if(m&&m[1]&&m[2]==='best')keys.push(m[1]);
  }
  var out='';
  keys.forEach(function(g){
    out+='<div class="lane"><span>'+g+'</span><div class="bar"><i style="width:'+Math.min(100,((st[g+'_best']||0)/10)*100)+'%"></i></div><span class="mut">Best '+ (st[g+'_best']||0)+' · '+ (st[g+'_played']||0)+' plays</span></div>';
  });
  document.getElementById('lb-recent').innerHTML=out||'<p class="mut">No game results yet. Play a game!</p>';
}
loadLb();
recentResults();
init();
</script>
</body>
</html>
