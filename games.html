function gmFresh(){var g;do{g=gmNew()}while(!gmHasMove(g));return g}
function gmStart(){GM={g:gmFresh(),pts:0,since:0,need:300,qn:0,moves:20,sel:null,busy:false,qp:null,over:false,chain:0};
$('gpbody').innerHTML='<div class="card" style="margin-top:18px"><div class="eyebrow" id="gmh"></div><p class="mut" style="margin:6px 0">Tap a gem, then a neighbor to swap. Match 3 or more. Hit the points goal to unlock a question: answer right for more moves.</p><div id="gmq"></div><div class="gmg" id="gmg"></div><div id="gmm" class="res"></div></div>';gmDraw();gmHud();$('gpbody').scrollIntoView({behavior:'smooth'})}
function gmHud(){var h=$('gmh');if(h&&GM)h.textContent='Points '+GM.pts+' · Moves '+GM.moves+' · Next question in '+Math.max(0,GM.need-GM.since)+' points'}
function gmDraw(pop){var e=$('gmg');if(!e||!GM)return;e.innerHTML=GM.g.map(function(row,r){return row.map(function(t,c){if(t<0)return '<span></span>';var s=GM.sel&&GM.sel[0]==r&&GM.sel[1]==c;return '<button class="gem t'+t+(s?' sel':'')+(pop&&pop[r+','+c]?' pop':'')+'" style="--c:'+GEMC[t]+'" onclick="gmClick('+r+','+c+')"><i></i></button>'}).join('')}).join('')}
function gmClick(r,c){if(!GM||GM.busy||GM.over||GM.qp)return;var s=GM.sel;
if(!s){GM.sel=[r,c]}else if(s[0]==r&&s[1]==c){GM.sel=null}else if(Math.abs(s[0]-r)+Math.abs(s[1]-c)==1){gmSwap(s,[r,c]);return}else{GM.sel=[r,c]}gmDraw()}
async function gmSwap(a,b){var g=GM.g,t;GM.busy=true;GM.sel=null;t=g[a[0]][a[1]];g[a[0]][a[1]]=g[b[0]][b[1]];g[b[0]][b[1]]=t;gmDraw();await sl(200);if(!$('gmg'))return;
if(!gmMatches(g).length){t=g[a[0]][a[1]];g[a[0]][a[1]]=g[b[0]][b[1]];g[b[0]][b[1]]=t;gmDraw();toast('No match. Try another swap');GM.busy=false;return}
GM.moves--;GM.chain=0;gmHud();await gmResolve();if(!$('gmg'))return;
if(GM.chain>=3)toast('Chain of '+GM.chain+'!');
if(!gmHasMove(GM.g)){GM.g=gmFresh();gmDraw();toast('No moves left on the board. Shuffled!')}
GM.busy=false;gmAfter()}
async function gmResolve(){var g=GM.g;while(true){var m=gmMatches(g);if(!m.length)break;GM.chain++;var gain=Math.round(m.length*10*(1+(GM.chain-1)*.5)),pop={};GM.pts+=gain;GM.since+=gain;m.forEach(function(x){pop[x[0]+','+x[1]]=1});gmDraw(pop);gmHud();await sl(280);if(!$('gmg'))return;
m.forEach(function(x){g[x[0]][x[1]]=-1});
for(var c=0;c<GN;c++){var col=[],r;for(r=GN-1;r>=0;r--)if(g[r][c]>=0)col.push(g[r][c]);while(col.length<GN)col.push(Math.floor(Math.random()*6));for(r=0;r<GN;r++)g[GN-1-r][c]=col[r]}
gmDraw();await sl(240);if(!$('gmg'))return}}
function gmAfter(){if(GM.since>=GM.need)gmAsk(1);else if(GM.moves<=0)gmEnd()}
function gmAsk(att){var q=ALLQ[Math.floor(Math.random()*ALLQ.length)];GM.qp={q:q,att:att};GM.busy=true;
$('gmq').innerHTML='<div class="card" style="margin:12px 0;border-color:var(--pri2)"><div class="eyebrow">Question time'+(att==2?' · last chance':'')+'</div><h3>'+q.q+'</h3>'+q.o.map(function(o,i){return '<button class="opt" onclick="gmAns('+i+')">'+o+'</button>'}).join('')+'<p class="src mut">Correct answer: +'+(att==1?10:5)+' moves'+(att==1?'. Miss it and you get one more chance.':'. Miss this one and there are no bonus moves.')+'</p></div>'}
function gmAns(i){var p=GM&&GM.qp;if(!p||p.lock)return;p.lock=true;
if(i==p.q.a){var b=p.att==1?10:5;GM.moves+=b;GM.qn++;GM.since=0;GM.need=300+100*GM.qn;bump('gemQ');GM.qp=null;$('gmq').innerHTML='';toast('Correct! +'+b+' moves');GM.busy=false;gmHud()}
else if(p.att==1){toast('Not quite. One more chance');setTimeout(function(){if(GM&&GM.qp)gmAsk(2)},700)}
else{GM.qn++;GM.since=0;GM.need=300+100*GM.qn;GM.qp=null;$('gmq').innerHTML='';toast('No bonus moves this time');GM.busy=false;gmHud();if(GM.moves<=0)gmEnd()}}
function gmEnd(){GM.over=true;GM.busy=true;var xp=Math.min(150,Math.floor(GM.pts/8));addXpBig(xp);bump('played');best('gemBest',GM.pts);$('gmm').innerHTML='<div class="eyebrow">Out of moves</div><h2>'+GM.pts+' points</h2><p class="mut">+'+xp+' XP (1 XP per 8 points, up to 150)</p><button class="btn" onclick="gpClose();gmStart()">Play again</button>'}
var RT=null;
function liveInvite(){var id=$('dfr').value,f=U.friends.filter(function(x){return x.id==id})[0];if(!f)return;if(RT)liveStop();
RT={role:'host',room:Math.random().toString(36).slice(2,10),opp:{id:f.id,name:f.name,s:0,ans:false},i:0,s:0,t:15,lock:false,state:'wait',qids:ALLQ.map(function(x,i){return i}).sort(rnd).slice(0,5)};
var g=$('gpbody'),room=RT.room;g.innerHTML='<div class="card res" style="margin-top:18px"><h3>Waiting for '+f.name+' to accept…</h3><p class="mut">They get a pop-up if they’re logged in.</p><button class="btn ghost" onclick="liveStop();$(\'gpbody\').innerHTML=\'\'">Cancel</button></div>';g.scrollIntoView({behavior:'smooth'});
sb.channel('inbox:'+f.id).subscribe(function(st){if(st=='SUBSCRIBED'){sb.channel('inbox:'+f.id).send({type:'broadcast',event:'invite',payload:{room:room,fromId:U.id}});setTimeout(function(){try{sb.removeChannel(sb.channel('inbox:'+f.id))}catch(e){}},1500)}});
setTimeout(function(){if(RT&&RT.room==room&&RT.state=='wait'){liveStop();var g2=$('gpbody');if(g2)g2.innerHTML='<div class="card res" style="margin-top:18px">'+f.name+' didn’t join. They may be offline.</div>'}},45000)}
function liveJoin(room,fid,name){if(RT)liveStop();RT={role:'guest',room:room,opp:{id:fid,name:name,s:0,ans:false},i:0,s:0,t:15,lock:false,state:'wait'};var g=$('gpbody');if(g){g.innerHTML='<div class="card res" style="margin-top:18px"><h3>Joining duel with '+name+'…</h3></div>';g.scrollIntoView({behavior:'smooth'})}
sb.channel('room:'+RT.room).send({type:'broadcast',event:'join',payload:{}})
setTimeout(function(){if(RT&&RT.room==room&&RT.state=='wait'){liveStop(1);var g2=$('gpbody');if(g2)g2.innerHTML='<div class="card res" style="margin-top:18px">The invite expired or '+name+' left.</div>'}},12000)}
function liveOpen(onReady){var c=sb.channel('room:'+RT.room,{config:{broadcast:{self:false}}});RT.ch=c;
c.on('broadcast',{event:'join'},function(){if(RT&&RT.role=='host'&&RT.state=='wait'){RT.state='play';c.send({type:'broadcast',event:'start',payload:{qids:RT.qids}});livePlay()}});
c.on('broadcast',{event:'start'},function(m){var q=m.payload&&m.payload.qids;if(RT&&RT.role=='guest'&&RT.state=='wait'&&Array.isArray(q)&&q.length==5&&q.every(function(i){return Number.isInteger(i)&&i>=0&&i<ALLQ.length})){RT.qids=q;RT.state='play';livePlay()}});
c.on('broadcast',{event:'next'},function(m){if(RT&&RT.role=='guest'&&RT.state=='play'&&m.payload.i>=0&&m.payload.i<5){RT.i=m.payload.i;RT.t=15;RT.lock=false;RT.opp.ans=false;liveDraw()}});
c.on('broadcast',{event:'ans'},function(m){var p=m.payload;if(RT&&RT.state=='play'&&p.i==RT.i&&Number.isInteger(p.s)){RT.opp.s=p.s;RT.opp.ans=true;liveHud();liveCheck()}});
c.on('broadcast',{event:'end'},function(m){if(RT&&RT.role=='guest'&&RT.state=='play'){RT.s=Number(m.payload.g)||0;RT.opp.s=Number(m.payload.h)||0;liveEnd()}});
c.on('broadcast',{event:'bye'},function(){if(RT&&RT.state!='done'){var n=RT.opp.name;liveStop(1);var g=$('gpbody');if(g)g.innerHTML='<div class="card res" style="margin-top:18px">'+n+' left the duel.</div>'}});
c.subscribe(function(st){if(st=='SUBSCRIBED'&&RT&&RT.ch===c)onReady()})}
function livePlay(){RT.iv=setInterval(liveTick,1000);liveDraw()}
function liveTick(){if(!RT||RT.state!='play')return;if(!$('gpbody')){liveStop();return}RT.t--;var e=$('dt');if(e)e.style.width=Math.max(0,RT.t/15*100)+'%';if(RT.t<=0){RT.lock=true;if(RT.role=='host'&&!RT.adv){RT.adv=true;liveAdvance()}}}
function liveCheck(){if(RT.role=='host'&&RT.lock&&RT.opp.ans&&!RT.adv){RT.adv=true;setTimeout(liveAdvance,900)}}
function liveAdvance(){if(!RT||RT.state!='play')return;RT.i++;RT.adv=false;if(RT.i>=5){RT.ch.send({type:'broadcast',event:'end',payload:{h:RT.s,g:RT.opp.s}});liveEnd();return}RT.t=15;RT.lock=false;RT.opp.ans=false;RT.ch.send({type:'broadcast',event:'next',payload:{i:RT.i}});liveDraw()}
function liveDraw(){var g=$('gpbody');if(!g||!RT)return;var q=ALLQ[RT.qids[RT.i]];g.innerHTML='<div class="card" style="margin-top:18px"><div class="eyebrow">Live duel vs '+RT.opp.name+' · Question '+(RT.i+1)+'/5</div><p id="lh" class="mut"></p><div class="bar"><i id="dt" style="width:100%;transition:width 1s linear"></i></div><h3 style="margin-top:16px">'+q.q+'</h3>'+q.o.map(function(o,i){return '<button class="opt" onclick="liveAns('+i+',this)">'+o+'</button>'}).join('')+'</div>';liveHud()}
function liveHud(){var e=$('lh');if(e&&RT)e.textContent='You '+RT.s+' · '+RT.opp.name+' '+RT.opp.s+(RT.opp.ans?' · answered':'')}
function liveAns(i,el){if(!RT||RT.lock||RT.state!='play')return;RT.lock=true;var ok=i==ALLQ[RT.qids[RT.i]].a;if(ok)RT.s+=10+Math.max(0,RT.t);el.classList.add(ok?'good':'no');RT.ch.send({type:'broadcast',event:'ans',payload:{i:RT.i,s:RT.s}});liveHud();liveCheck()}
function liveEnd(){if(!RT||RT.state=='done')return;clearInterval(RT.iv);RT.state='done';var me=RT.s,op=RT.opp.s,n=RT.opp.name,win=me>op,xp=30+(win?20:0),g=$('gpbody'),c=RT.ch;bump('duels');if(win)bump('duelWins');addXp(xp);
if(g)g.innerHTML='<div class="card res" style="margin-top:18px"><div class="eyebrow">'+(win?'Victory':me<op?'Defeat':'Draw')+'</div><h2>You '+me+' – '+op+' '+n+'</h2><p class="mut">+'+xp+' XP</p></div>';setTimeout(function(){try{sb.removeChannel(c)}catch(e){}},1500);RT=null}
function liveStop(q){if(!RT)return;clearInterval(RT.iv);var c=RT.ch;try{if(c){if(!q)c.send({type:'broadcast',event:'bye',payload:{}});setTimeout(function(){sb.removeChannel(c)},800)}}catch(e){}RT=null}
function rnd(){return Math.random()-.5}
init();
</script>
</body>
</html>
