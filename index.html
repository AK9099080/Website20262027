<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AxonEDU – Learn AI</title>

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.55}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(900px 420px at 80% -10%,color-mix(in srgb,var(--pri) 25%,transparent),transparent),linear-gradient(var(--line) 1px,transparent 1px) 0 0/46px 46px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/46px 46px;opacity:.55;z-index:-1}
h1,h2,h3{margin:.2em 0;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}a{color:var(--pri2)}
.top{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 22px 6px;position:sticky;top:0;z-index:20}#auth{position:absolute;right:22px;top:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.01em;cursor:pointer}.logo em{font-style:normal;color:var(--pri2)}
.nav{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.nav a,.sub a{padding:7px 13px;border-radius:8px;text-decoration:none;color:var(--mut);font-weight:600;font-size:14px;cursor:pointer}
.nav a:hover,.sub a:hover{color:var(--ink);background:var(--bg2)}
.nav a.on,.sub a.on{color:var(--ink);background:var(--bg2);box-shadow:inset 0 -2px 0 var(--pri2)}
.sub{background:var(--bg2);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 22px;flex-wrap:wrap;align-items:center;position:relative;min-height:46px}
.sub .me{position:absolute;right:22px;top:50%;transform:translateY(-50%);color:var(--mut);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}@media(max-width:900px){#auth{position:static}.sub .me{position:static;transform:none;width:100%;justify-content:center;margin-top:4px}}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:9px;padding:9px 20px;font-weight:700;transition:.15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.gold{background:var(--ink);color:var(--bg)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
main{max-width:1060px;margin:0 auto;padding:26px 20px 60px}
.hero{border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 28%,var(--card)),var(--card) 70%);border-radius:18px;padding:48px 36px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;overflow:hidden}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.08}.hero p{font-size:17px;color:var(--mut);max-width:520px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--pri2);font-weight:700}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero img{display:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;transition:.15s}
.grid .card:hover{border-color:var(--pri2);transform:translateY(-2px)}.mut{color:var(--mut)}
.chip{width:42px;height:42px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-family:Consolas,monospace;font-weight:700;font-size:15px;color:var(--pri2);border:1px solid var(--pri2);background:color-mix(in srgb,var(--pri2) 10%,transparent);margin-bottom:6px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:5px;margin:2px 4px 2px 0;border:1px solid var(--line);color:var(--mut)}
.tag{background:var(--bg2)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .4s}
.big{font-size:36px;font-weight:800;font-family:Consolas,monospace;color:var(--pri2)}
.sec{margin-top:40px}.sec>h2{font-size:24px}
.modal{position:fixed;inset:0;background:rgba(4,7,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:540px;width:100%;max-height:90vh;overflow:auto}
input[type=text],input[type=password]{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--line);font:inherit;background:var(--bg);color:var(--ink);margin:12px 0}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px;padding:6px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.pill.on{border-color:var(--pri2);color:var(--ink);box-shadow:0 0 0 1px var(--pri2)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600}
.opt:hover{border-color:var(--pri2)}.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.lane{display:flex;align-items:center;gap:12px;margin:8px 0;font-weight:600;font-size:13px}.lane .bar{flex:1;height:10px;margin:0}.lane span:first-child{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:11px 8px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}tr.me td{background:color-mix(in srgb,var(--pri2) 12%,transparent);font-weight:700}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;flex:none}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:100px;margin:8px;text-align:center;font-size:12px;font-weight:600}.badge b{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:Consolas,monospace;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));margin-bottom:6px}.badge.lock{opacity:.3;filter:grayscale(1)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:9px;font-weight:700;z-index:99;font-size:14px}
.src{font-size:12px}.res{text-align:center;padding:10px}
footer{text-align:center;color:var(--mut);padding:24px;font-size:12px}
.xpm{display:inline-block;width:80px;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:0 4px}.xpm i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}.sub .me b{color:var(--ink)}
textarea{border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:10px;font:12px Consolas,monospace;margin:8px 0}
select{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-width:180px}

<script>
var MODS=[
{id:'basics',t:'AI Basics',ic:'01',tags:['Easy','Essential','First'],d:'What AI really is, and what it isn’t.',L:[
['What is AI?','Artificial intelligence is software that finds patterns in data so it can make predictions or decisions. It doesn’t “think” like a person; it calculates what is most likely.'],
['Machine learning','Instead of writing every rule by hand, we show a computer thousands of examples and it learns the rules itself. Spam filters learn what spam looks like this way.'],
['Training data','An AI is only as good as the data it learned from. Missing or lopsided data means the AI will be missing or lopsided too.']]},
{id:'tools',t:'Practical AI Tools',ic:'02',tags:['Easy','Essential'],d:'Tools that can help with school work.',L:[
['Chatbots & assistants','Chatbots can explain ideas, quiz you, and give feedback on drafts. Treat them like a tutor you double-check, not an answer machine.'],
['Study helpers','AI can turn your notes into flashcards, summarize long readings, or explain a hard topic in simpler words. You still do the learning.'],
['Checking the output','Always verify names, dates, and numbers against a trusted source. AI can sound confident and still be wrong.']]},
{id:'ethics',t:'Ethical AI Use',ic:'03',tags:['Essential','Medium'],d:'Honesty, fairness and privacy.',L:[
['Academic honesty','Know your school’s AI policy. If AI helped, say so. Submitting AI work as your own is plagiarism, even when it’s hard to detect.'],
['Bias & fairness','AI learns from human data, so it can copy human unfairness. Ask: who might this tool work badly for?'],
['Privacy','Never type passwords, addresses, or classmates’ personal details into an AI tool. Assume what you type may be stored.']]},
{id:'gen',t:'Generative AI',ic:'04',tags:['Medium'],d:'How AI writes, draws and composes.',L:[
['How it generates','Generative models learn patterns from huge amounts of text or images, then produce new content one piece at a time by predicting what comes next.'],
['Hallucinations','Sometimes a model invents facts, quotes, or sources that look real. This is called a hallucination, and it’s why you verify.'],
['Deepfakes & media','AI can make fake images, audio and video. Check the source, look for odd details, and pause before sharing.']]},
{id:'opt',t:'Optimizing Your AI Use',ic:'05',tags:['Hard'],d:'Get better results with smarter habits.',L:[
['Write better prompts','Give context, a goal, and a format: “Explain photosynthesis to a 9th grader in 5 bullet points.” Clear asks get clearer answers.'],
['Iterate','Your first answer is a draft. Follow up: “make it shorter,” “give an example,” “what’s the counterargument?”'],
['Think first, AI second','Try the problem yourself, then use AI to check or stretch your thinking. You’ll learn more and trust the result more.']]}];

function av(sz,u){u=u||U;var i=typeof u.av==='number'?u.av:0;return '<span class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.45)+'px;background:linear-gradient(135deg,'+AVS[i][0]+')">'+u.name.charAt(0).toUpperCase()+'</span>'}

var U=null,DB={},route='home',filt='All',lb='friends',G=null;
function load(){}
function save(){}
function $(i){return document.getElementById(i)}
function lvl(){return Math.floor(U.xp/100)+1}
function prog(m){return Math.round(((U.done[m.id]||[]).length/m.L.length)*100)}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2400)}

function home(){return '<div class="hero"><div><div class="eyebrow">AI literacy for grades 9–12</div><h1>Understand AI. Use it well. Level up.</h1><p>AxonEDU is a free learning portal for grades 9–12. Learn how AI works, try real tools, and earn XP while you do it.</p><button class="btn gold" onclick="'+(U?"go(\'dash\')":'loginBox()')+'" style="font-size:17px;padding:12px 26px">'+(U?'Continue learning':'Start learning')+'</button></div><img src="https://github.com/AK9099080/Website20262027/blob/main/img/hero.png?raw=true" alt="AxonEDU hero" style="width:100%;border-radius:14px;border:1px solid var(--line);display:block" onerror="this.style.display=\'none\'"></div>'+

'<div class="sec"><h2>5 learning modules</h2><div class="grid">'+MODS.map(function(m){return '<div class="card"><div class="chip">'+m.ic+'</div><h3>'+m.t+'</h3><p class="mut">'+m.d+'</p>'+tags(m)+'</div>'}).join('')+'</div></div>'}

(st.length?'<h2>In progress</h2><div class="grid">'+st.map(mcard).join('')+'</div>':'')+'<div class="sec"><h2>All modules</h2><div class="grid">'+list.map(mcard).join('')+'</div></div>'}

function duelNext(ok,t){if(ok)DG.s+=10+Math.max(0,t);DG.i++;DG.t=15;DG.lock=false;if(DG.i>=5)duelEnd();else duelDraw()}
async function duelEnd(){clearInterval(DG.iv);DG.lock=true;var d=DG.d,s=DG.s,g=$('game');if(!g)return;g.innerHTML='<div class="card res" style="margin-top:18px"><h2>Saving your result…</h2></div>';
var r=d.mode=='new'?await sb.from('duels').insert({challenger:U.id,opponent:d.opp,qids:d.qids,c_score:s}):await sb.from('duels').update({o_score:s}).eq('id',d.id).is('o_score',null).select();
if(r.error||(d.mode!='new'&&!(r.data&&r.data.length))){g.innerHTML='<div class="card res" style="margin-top:18px">Could not save the duel. Check your connection and that the duels SQL has been run.</div>';return}
addXp(30);g.innerHTML='<div class="card res" style="margin-top:18px"><div class="eyebrow">Duel played</div><h2>Your score: '+s+'. +30 XP</h2><p class="mut">'+(d.mode=='new'?'Your friend will see the challenge on their Games page.':'See the results list below.')+'</p></div>';loadDuels()}
init();
</script></body></html>
