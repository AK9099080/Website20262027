<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>References | AxonEDU</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="nav-root"></div>
<main style="max-width:1000px;margin:0 auto;padding:30px 20px 60px">
  <h1 style="font-size:34px">References</h1>
  <p class="mut" style="font-size:17px">Sources behind the stats, lessons, and guidance used across AxonEDU.</p>

  <section class="sec">
    <h2>Sources</h2>
    <div id="refs-root" class="grid"></div>
  </section>
</main>
<div id="footer-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var out='';
  REFERENCES.forEach(function(r){
    out+='<div class="card"><h3 style="margin:0 0 6px"><a href="'+r[1]+'" target="_blank" rel="noopener">'+r[0]+'</a></h3><span class="tag">'+r[3]+'</span><p style="font-size:14px;color:var(--ink);margin:6px 0 4px">'+r[2]+'</p><div class="src">'+r[1]+'</div></div>';
  });
  document.getElementById('refs-root').innerHTML=out;
})();
init();
</script>
</body>
</html>
