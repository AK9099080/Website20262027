<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News | AxonEDU</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="nav-root"></div>
<main style="max-width:900px;margin:0 auto;padding:30px 20px 60px">
  <h1 style="font-size:34px">AI News</h1>
  <p class="mut" style="font-size:17px">A quick look at what's happening in AI right now.</p>

  <section class="sec">
    <h2>Recent stories</h2>
    <div id="news-root" class="grid"></div>
  </section>
</main>
<div id="footer-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var out='';
  NEWS.forEach(function(n){
    out+='<div class="card"><div class="tag">'+n[2]+'</div><h3 style="margin:8px 0 6px">'+n[0]+'</h3><p style="font-size:15px;color:var(--ink)">'+n[1]+'</p></div>';
  });
  document.getElementById('news-root').innerHTML=out;
})();
init();
</script>
</body>
</html>
